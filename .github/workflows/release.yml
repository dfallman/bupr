name: release

# Build the macOS binaries, publish them as a GitHub release and update the
# Homebrew formula whenever a version tag is pushed. Tags are cut by
# scripts/release.sh:
#
#   ./scripts/release.sh     # bumps the patch version, tags vX.Y.Z, pushes

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # macos-13 was retired in Dec 2025; macos-15-intel is the last
          # Intel image (supported until Fall 2027).
          - target: x86_64-apple-darwin
            os: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: check the tag matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          have="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$want" != "$have" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${have}"
            exit 1
          fi

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          stage="bupr-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$stage"
          cp "target/${{ matrix.target }}/release/bupr" "$stage/"
          strip "$stage/bupr" || true
          cp README.md LICENSE "$stage/"
          tar czf "${stage}.tar.gz" "$stage"
          echo "ASSET=${stage}.tar.gz" >> "$GITHUB_ENV"

      - name: upload to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
          fail_on_unmatched_files: true

  homebrew:
    name: Update Homebrew tap
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Regenerate formula and push to dfallman/homebrew-tap
        env:
          GH_TOKEN: ${{ github.token }}
          # Fine-grained PAT with contents:write on dfallman/homebrew-tap.
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_GITHUB_TOKEN secret not set; skipping tap update."
            exit 0
          fi
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          mkdir artifacts
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.tar.gz' --dir artifacts
          sha() { shasum -a 256 "artifacts/bupr-${tag}-$1.tar.gz" | cut -d' ' -f1; }

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/dfallman/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cat > tap/Formula/bupr.rb << EOF
          # typed: false
          # frozen_string_literal: true

          # This formula is regenerated automatically by the release workflow in
          # dfallman/bupr (.github/workflows/release.yml) on every tagged release.
          class Bupr < Formula
            desc "Preset-based mirror backups for macOS"
            homepage "https://github.com/dfallman/bupr"
            version "${version}"
            license "MIT"

            depends_on :macos

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/dfallman/bupr/releases/download/${tag}/bupr-${tag}-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              else
                url "https://github.com/dfallman/bupr/releases/download/${tag}/bupr-${tag}-x86_64-apple-darwin.tar.gz"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end

            def install
              bin.install "bupr"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/bupr --version")
            end
          end
          EOF
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/bupr.rb
          git diff --cached --quiet && { echo "Formula unchanged."; exit 0; }
          git commit -m "bupr ${tag}"
          git push
