[package]
name = "bupr"
version = "0.1.1"
edition = "2024"
description = "Preset-based mirror backups for macOS, with project-aware excludes and a kernel-sandboxed copier"
license = "MIT"
repository = "https://github.com/dfallman/bupr"
readme = "README.md"
keywords = ["backup", "mirror", "macos", "cli", "rsync"]
categories = ["command-line-utilities", "filesystem"]
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
bytesize = "2.7.0"
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
caseless = "0.2.2"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
globset = "0.4.20"
indexmap = { version = "2", features = ["serde"] }
inquire = "0.9.4"
jiff = "0.2.37"
libc = "0.2.189"
plist = "1.10.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = { version = "1.1.6", features = ["preserve_order"] }
unicode-normalization = "0.1.25"
xattr = "1.6.1"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.48.0"
predicates = "3.1.4"
tempfile = "3.27.0"
